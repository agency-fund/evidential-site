version: "3"

vars:
  PORT: 4322
  # Keep in sync with SITES in .github/scripts/preview_cleanup.py.
  PREVIEW_WORKER: evidential-docs-preview
  OPENAPI_URL: https://api.evidential.dev/openapi.json

tasks:
  install:
    desc: Install dependencies from the lockfile.
    cmd: pnpm install --frozen-lockfile

  start:
    desc: "Run the Astro dev server with hot reload at http://localhost:{{.PORT}}. Search uses the last build's index; rerun `task docs:build` to refresh it."
    interactive: true
    deps: [openapi:polish, search-index]
    cmd: pnpm exec astro dev --port {{.PORT}}

  build:
    desc: Build the static site into dist/, including the search index, llms.txt, Markdown versions, and share cards.
    deps: [openapi:polish]
    cmd: pnpm exec astro build

  ci:check:
    desc: "CI only (docs workflow): build, then run every check. The link check reads the build, so it runs second."
    cmds:
      - task: build
      - task: check

  deploy:preview:
    desc: "Build and push a Cloudflare Preview from this machine (needs `wrangler login` or CLOUDFLARE_API_TOKEN). Named after the git branch unless NAME=… is given. Prints the public Preview URL."
    cmds:
      - task: build
      # Previews go to their own Worker, so the token CI uses for them can't touch production.
      - >-
        pnpm exec wrangler preview --worker-name {{.PREVIEW_WORKER}}
        {{if .NAME}}--name {{.NAME}}{{end}}
        {{if .MESSAGE}}--message "{{.MESSAGE}}"{{end}}
        {{.CLI_ARGS}}

  launch:
    desc: "First production deploy: attaches docs.evidential.dev to evidential-docs. Run once, with `wrangler login`; see the README's First Deploy."
    interactive: true
    cmd: scripts/launch.sh

  ci:deploy:production:
    desc: "CI only (docs workflow, main branch): build, then upload and deploy a new production version of evidential-docs. The first deploy is `task docs:launch`."
    cmds:
      - task: build
      # `wrangler deploy` would also re-attach the custom domain, which needs zone permissions the CI token deliberately
      # lacks. Uploading a version and deploying it changes only the code, assets, and bindings; secrets carry over.
      - |
        set -euo pipefail
        out=$(mktemp)
        WRANGLER_OUTPUT_FILE_PATH="$out" pnpm exec wrangler versions upload
        version=$(sed -n 's/.*"type":"version-upload".*"version_id":"\([^"]*\)".*/\1/p' "$out")
        rm "$out"
        pnpm exec wrangler versions deploy "$version@100%" --yes

  search-index:
    # Builds the site when anything that feeds the search index changed, so `start` can serve a current index.
    internal: true
    sources:
      - astro.config.ts
      - src/**/*
    generates:
      - dist/pagefind/pagefind-entry.json
    cmds:
      - task: build

  preview:
    desc: "Build, then serve dist/ at http://localhost:{{.PORT}}, as the site will be deployed."
    interactive: true
    deps: [build]
    cmd: pnpm exec astro preview --port {{.PORT}}

  check:
    desc: Type-check the site, check its Nimbus setup and config, and lint the content.
    cmds:
      - pnpm exec astro check
      - pnpm exec nimbus-docs check
      - pnpm exec nimbus-docs lint

  lint:
    desc: Lint the content with the authoring rules in astro.config.ts. Pass --fix after -- to apply safe fixes.
    cmd: pnpm exec nimbus-docs lint {{.CLI_ARGS}}

  openapi:
    desc: Download the live API's spec into src/api/openapi.upstream.json and regenerate src/api/openapi.json. Commit both.
    cmds:
      - curl --fail --silent --show-error --location --output src/api/openapi.upstream.json.part {{.OPENAPI_URL}}
      # Reformatted so updates show up as readable diffs.
      - jq . src/api/openapi.upstream.json.part > src/api/openapi.upstream.json
      - rm src/api/openapi.upstream.json.part
      - task: openapi:polish

  openapi:polish:
    desc: Regenerate src/api/openapi.json from the upstream spec, src/api/overview.md, and scripts/polish-openapi.mjs.
    sources:
      - src/api/openapi.upstream.json
      - src/api/overview.md
      - scripts/polish-openapi.mjs
    generates:
      - src/api/openapi.json
    cmd: pnpm exec node scripts/polish-openapi.mjs src/api/openapi.upstream.json src/api/openapi.json

  walkthrough:
    desc: "Record a 30-second tour video and share-preview cards into walkthrough/output/. Needs ffmpeg. Pass e.g. ONLY=video to make one artifact."
    cmds:
      - pnpm exec playwright install chromium
      - pnpm exec node walkthrough/index.ts {{if .ONLY}}--only {{.ONLY}}{{end}}

  outdated:
    desc: List starter files, components, and package API changes that Nimbus has made upstream since this site was scaffolded.
    cmd: pnpm exec nimbus-docs outdated

  nimbus:
    desc: "Run any nimbus-docs command, e.g. `task docs:nimbus -- list --type ui` or `task docs:nimbus -- add tabs`."
    interactive: true
    cmd: pnpm exec nimbus-docs {{.CLI_ARGS}}
