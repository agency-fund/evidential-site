name: Deploy a site to production
description: >-
  Builds a site and deploys a new production version (task <site>:ci:deploy:production). Run it after checking out the
  repository, in a job that declares the production environment, which holds the token.
inputs:
  site:
    description: The site's directory under sites/ and its Task namespace, such as www or docs.
    required: true
  cloudflare-api-token:
    description: The production environment's CLOUDFLARE_API_TOKEN.
    required: true
  cloudflare-account-id:
    description: The Cloudflare account that holds the site's Workers.
    required: true
runs:
  using: composite
  steps:
    - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
      with:
        cache: true
        require-lockfile: true
    - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
      with:
        version: 3.x
        repo-token: ${{ github.token }}
    - shell: bash
      run: task "${SITE}:ci:deploy:production"
      env:
        SITE: ${{ inputs.site }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
