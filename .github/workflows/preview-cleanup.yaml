name: preview cleanup

# Deletes the Cloudflare Previews (pr-<number>) that the www and docs workflows created for a pull request once the
# pull request is closed or merged, for each site in turn. A weekly sweep also deletes any pr-* Preview whose pull
# request is closed, in case a close event was missed. Previews with other names (e.g. pushed from a workstation) are
# left alone.
on:
  pull_request:
    branches: [main]
    types: [closed]
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delete-previews:
    # Fork and Dependabot pull requests never had a Preview, and runs Dependabot triggers can't read the Cloudflare token.
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.head.repo.full_name == github.repository
        && github.event.pull_request.user.login != 'dependabot[bot]')
    strategy:
      fail-fast: false
      matrix:
        site: [www, docs]
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
    concurrency:
      group: >-
        ${{ case(
          github.event_name == 'pull_request', format('{0}-preview-pr-{1}', matrix.site, github.event.pull_request.number),
          format('{0}-preview-sweep', matrix.site)
        ) }}
      # Shared with the preview jobs in www.yaml and docs.yaml; waits for a running deploy rather than cancelling it.
      cancel-in-progress: false
    steps:
      # Run the script from the default branch, never from the closed pull request's code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Delete the closed pull request's Preview
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE: ${{ matrix.site }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: uv run --locked --script .github/scripts/preview_cleanup.py --site "$SITE" pull-request-closed "$PR_NUMBER"
      - name: Delete Previews of all closed pull requests
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          SITE: ${{ matrix.site }}
        run: uv run --locked --script .github/scripts/preview_cleanup.py --site "$SITE" sweep
