name: site check

# Reusable: runs a site's checks (task <site>:ci:check), as defined in sites/<site>/Taskfile.yml. Called by www.yaml
# and docs.yaml.
on:
  workflow_call:
    inputs:
      site:
        description: The site's directory under sites/ and its Task namespace, such as www or docs.
        type: string
        required: true
      fetch-depth:
        description: Git history to fetch. Docs builds need all of it (0) for "Last updated" dates and the sitemap.
        type: number
        default: 1
      artifact-path:
        description: Files to upload after the checks, even when they fail, such as Lighthouse reports.
        type: string
        default: ""
      lighthouse:
        description: Whether the site's checks include Lighthouse, for sites that run it (passed to Task as LIGHTHOUSE).
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - run: task "${SITE}:ci:check"
        env:
          SITE: ${{ inputs.site }}
          LIGHTHOUSE: ${{ inputs.lighthouse }}
      - if: ${{ !cancelled() && inputs.artifact-path != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.site }}-check-reports
          path: ${{ inputs.artifact-path }}
          # Report directories such as www's .lighthouseci/ are hidden, which upload-artifact skips by default.
          include-hidden-files: true
          # Checks that were skipped, such as Lighthouse, leave nothing to upload.
          if-no-files-found: ignore
          retention-days: 14
