name: docs

on:
  pull_request:
    branches: [main]
    paths: &paths
      - sites/docs/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - Taskfile.yml
      - .github/workflows/docs.yaml
      - .github/workflows/site-check.yaml
      - .github/actions/deploy-*/**
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run outright, including a Preview deploy in progress; the preview
# job's own concurrency setting can't prevent that.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: $/.github/workflows/site-check.yaml
    with:
      site: docs
      # "Last updated" dates and the sitemap come from git history.
      fetch-depth: 0

  preview-wanted:
    needs: check
    # Fork and Dependabot pull requests can't read the preview environment's token.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      wanted: ${{ steps.filter.outputs.visible }}
    steps:
      # Only pull requests that change files readers see get a Preview; tooling, tests, docs, and dependency-only changes
      # don't. On pull_request events, paths-filter lists the changed files through the API; no checkout needed.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Pages, the API reference's spec and overview, components, styles, and site config.
          filters: |
            visible:
              - 'sites/docs/src/**'
              - 'sites/docs/public/**'
              - 'sites/docs/astro.config.ts'
              - 'sites/docs/scripts/polish-openapi.mjs'

  preview:
    needs: preview-wanted
    if: needs.preview-wanted.outputs.wanted == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    # This job runs the pull request's code with the preview environment's token. That token can only change the sites'
    # preview Workers, which hold nothing but Previews; the production token is in the main-only production
    # environment.
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    # Shared with preview-cleanup.yaml. Neither cancels the other: a cleanup waits for a running deploy and then
    # deletes its Preview, and a deploy queued behind a cleanup sees the closed pull request and skips. A newer push
    # cancels this whole run, even mid-deploy (see the workflow's concurrency). That's safe: an interrupted upload
    # leaves the previous version serving, and the newer run deploys the same Preview again once its checks pass.
    concurrency:
      group: docs-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/deploy-preview
        id: deploy
        with:
          site: docs
          preview-worker: evidential-docs-preview
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  production:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    environment:
      name: production
      url: https://docs.evidential.dev
    # Deploys run one at a time and are never canceled midway.
    concurrency:
      group: docs-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: $/.github/actions/deploy-production
        with:
          site: docs
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
