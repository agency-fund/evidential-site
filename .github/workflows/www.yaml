name: www

on:
  pull_request:
    branches: [main]
    paths: &paths
      - sites/www/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - Taskfile.yml
      - .github/workflows/www.yaml
      - .github/workflows/site-*.yaml
  push:
    branches: [main]
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    uses: $/.github/workflows/site-check.yaml
    with:
      site: www
      artifact-path: sites/www/.lighthouseci/

  preview:
    needs: check
    # Fork and Dependabot pull requests can't read the preview environment's token.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
    uses: $/.github/workflows/site-preview.yaml
    with:
      site: www
      preview-worker: evidential-www-preview
      note: Previews are not indexed and the contact form does not send email.
      # The page, its assets, and the contact-form Worker; * doesn't cross /, so worker/test/ is excluded.
      preview-filter: |
        visible:
          - 'sites/www/src/**'
          - 'sites/www/public/**'
          - 'sites/www/worker/*.ts'
          - 'sites/www/astro.config.mjs'

  production:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    uses: $/.github/workflows/site-production.yaml
    with:
      site: www
      url: https://www.evidential.dev
