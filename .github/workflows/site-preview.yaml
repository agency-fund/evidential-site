name: site preview

# Reusable: pushes a pull request's Preview of a site (task <site>:deploy:preview NAME=pr-<number>) and comments its
# URL on the pull request. Called by www.yaml and docs.yaml for same-repo, non-Dependabot pull requests.
on:
  workflow_call:
    inputs:
      site:
        description: The site's directory under sites/ and its Task namespace, such as www or docs.
        type: string
        required: true
      preview-worker:
        description: The Worker that holds the site's Previews; it appears in their URLs.
        type: string
        required: true
      preview-filter:
        description: >-
          A dorny/paths-filter definition with one filter, `visible`, matching the files readers see. Only pull
          requests that change one get a Preview; tooling, tests, docs, and dependency-only changes don't.
        type: string
        required: true
      note:
        description: A sentence the Preview's comment adds after the URL.
        type: string
        default: Previews are not indexed.
      fetch-depth:
        description: Git history to fetch. Docs builds need all of it (0) for "Last updated" dates and the sitemap.
        type: number
        default: 1

permissions:
  contents: read

jobs:
  wanted:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      wanted: ${{ steps.filter.outputs.visible }}
    steps:
      # On pull_request events, paths-filter lists the pull request's changed files through the API; no checkout needed.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: ${{ inputs.preview-filter }}
  deploy:
    needs: wanted
    if: needs.wanted.outputs.wanted == 'true'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    # This job runs the pull request's code with the preview environment's token. That token can only change the sites'
    # preview Workers, which hold nothing but Previews; the production token is in the main-only production
    # environment.
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    # Shared with preview-cleanup.yaml. Neither cancels the other: a cleanup waits for a running deploy and then
    # deletes its Preview, and a deploy queued behind a cleanup sees the closed pull request and skips. A newer push's
    # deploy replaces an older one that hasn't started yet.
    concurrency:
      group: ${{ inputs.site }}-preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SITE: ${{ inputs.site }}
          WORKER: ${{ inputs.preview-worker }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Checked inside the concurrency group: if the pull request closed while this job waited, deploying would
          # recreate the Preview that cleanup just deleted.
          state=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq .state)
          if [[ "${state}" != open ]]; then
            echo "Pull request #${PR_NUMBER} is ${state}; not deploying its Preview."
            exit 0
          fi
          task "${SITE}:deploy:preview" NAME="pr-${PR_NUMBER}" MESSAGE="PR #${PR_NUMBER} @ ${HEAD_SHA}" | tee deploy.log
          url=$(grep -oE "https://pr-${PR_NUMBER}-${WORKER}\.[a-z0-9-]+\.workers\.dev" deploy.log | head -1)
          test -n "${url}"
          echo "url=${url}" >> "${GITHUB_OUTPUT}"
      - name: Comment preview URL on the PR
        if: steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SITE: ${{ inputs.site }}
          NOTE: ${{ inputs.note }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          # Keep the marker in sync with comment_marker() in .github/scripts/preview_cleanup.py.
          marker="<!-- ${SITE}-preview -->"
          body=$(printf '%s\n**%s preview:** %s\n\nBuilt from %s. %s' "${marker}" "${SITE}" "${URL}" "${HEAD_SHA}" "${NOTE}")
          id=$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | head -1)
          if [ -n "${id}" ]; then
            gh api -X PATCH "repos/${REPO}/issues/comments/${id}" -f body="${body}" > /dev/null
          else
            gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" -f body="${body}" > /dev/null
          fi
