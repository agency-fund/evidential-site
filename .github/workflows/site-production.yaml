name: site production

# Reusable: deploys a new production version of a site (task <site>:ci:deploy:production). Called by www.yaml and
# docs.yaml on pushes to main.
on:
  workflow_call:
    inputs:
      site:
        description: The site's directory under sites/ and its Task namespace, such as www or docs.
        type: string
        required: true
      url:
        description: Where the deployed site is served, shown on the deployment.
        type: string
        required: true
      fetch-depth:
        description: Git history to fetch. Docs builds need all of it (0) for "Last updated" dates and the sitemap.
        type: number
        default: 1

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    # A site's deploys run one at a time and are never cancelled midway.
    concurrency:
      group: ${{ inputs.site }}-production
      cancel-in-progress: false
    environment:
      name: production
      url: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: ${{ inputs.fetch-depth }}
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ github.token }}
      - run: task "${SITE}:ci:deploy:production"
        env:
          SITE: ${{ inputs.site }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
