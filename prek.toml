# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "3e8a8703264a2f4a69428a0aa4dcb512790b2c8c"  # frozen: v6.0.0
hooks = [
  { id = "check-json", exclude = '(^|/)tsconfig\.json$' },
  { id = "check-toml" },
  { id = "check-yaml", args = ["--allow-multiple-documents"] },
  { id = "check-xml" },
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "destroyed-symlinks" },
  { id = "detect-private-key" },
  { id = "end-of-file-fixer", exclude = '^sites/www/(public/.*\.(ico|png)|worker/worker-configuration\.d\.ts)$' },
  { id = "trailing-whitespace", exclude = '^sites/www/worker/worker-configuration\.d\.ts$' },
  { id = "check-added-large-files", args = ["--maxkb=300"] }
]

[[repos]]
repo = "https://github.com/zizmorcore/zizmor-pre-commit"
rev = "06a39750ec31860bb44f2acf67182c40016cd1e7"  # frozen: v1.32.0
hooks = [
  { id = "zizmor" }
]

[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "39d5bdcf34db54e944facac5cf6e8b03db5e2b99"  # frozen: v1.10.1
hooks = [
  { id = "betterleaks" }
]
